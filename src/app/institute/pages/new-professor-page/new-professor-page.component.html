<h4>
  {{ currentProfessor.nombre ? 'Editar' : 'Agregar'}}
  Profesor
  <small *ngIf="currentProfessor.nombre">{{ currentProfessor.nombre }}</small>
</h4>

<mat-divider class="mb-2"></mat-divider>

<div class="grid">
  <div class="col-12 sm:col-6">
    <mat-card>
      <mat-card-content>
        <form class="grid" [formGroup]="professorForm" (ngSubmit)="onSubmit()">
          <mat-form-field class="col-12 sm:col-6">
            <mat-label>Estudiante</mat-label>
             <input
             matInput
             type="text"
             required
             formControlName ="nombre"
             />
          </mat-form-field>
           <mat-form-field class="col-12">
            <mat-label>Alternative Image</mat-label>
            <input
              matInput
              type="text"
              formControlName="altImg"
            />
          </mat-form-field>
        </form>

        <div class="flex justify-content-between">
          <button
            *ngIf="currentProfessor.nombre"
            (click)="onConfirmDeletion()"
            mat-flat-button
            color="warn">
              Borrar
          </button>
          <span></span>

          <button
            mat-flat-button
            color="primary"
            (click)="onSubmit()">
          <mat-icon>save</mat-icon>
            Guardar
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <div class="col-12 sm:col-6">
        <mat-card>
          <img [src]=" currentProfessor | professorImage" alt="imagen del profesor" mat-card-image>
        </mat-card>
  </div>

</div>
