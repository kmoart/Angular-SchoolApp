<ng-template #divLoading>
  <mat-grid-list cols="1">
    <mat-grid-tile>
      <mat-spinner></mat-spinner>
    </mat-grid-tile>
  </mat-grid-list>
</ng-template>

<div *ngIf="student; else divLoading" class="grid p-2">
    <mat-card class="col-12 sm:col-6">
        <mat-card-header>
          <mat-card-title>Id:  {{ student.id }}</mat-card-title>
          <mat-card-subtitle>Nombre: {{ student.nombre }}</mat-card-subtitle>
        </mat-card-header>

        <img [src]="student | studentImage" [alt]="student.nombre" mat-card-image />
    </mat-card>

    <mat-card class="col-12 sm:col-6">
        <mat-card-header>
          <mat-card-title>Información del Estudiante</mat-card-title>
          <mat-card-subtitle>{{ student.nombre }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <mat-list>
            <mat-list-item>Id: {{ student.id }}</mat-list-item>
            <mat-list-item>Nombre: {{ student.nombre }}</mat-list-item>
          </mat-list>

          <button
            mat-button
            color="warn"
            (click)="goBack()"
          >
            Regresar
          </button>
        </mat-card-content>

    </mat-card>
</div>
