<mat-card>
  <mat-card-header>
    <mat-card-title>{{ professor.nombre }}</mat-card-title>
    <mat-card-subtitle>{{ professor.id }}</mat-card-subtitle>
  </mat-card-header>

  <!--TODO: imagen-->
  <img mat-card-image [src]=" professor | professorImage" [alt]="professor.id">

  <mat-card-content class="mt-2">
    <h4>{{ professor.nombre }}</h4>
    <p>
      <strong>Número de Id:</strong>{{ professor.id }}
      <br>
    </p>
  </mat-card-content>
  <mat-divider></mat-divider>
  <mat-card-actions>
    <button mat-button
      mat-raised
      color="primary"
      [routerLink]="['/institute/editProfessor',professor.id]">
    <mat-icon>edit</mat-icon>
    Editar
    </button>
    <span class="spacer"></span>
    <button mat-button
      mat-raised
      [routerLink]="['/institute/detailProfessor',professor.id]">
      <mat-icon>more_horiz</mat-icon>
      Más...
    </button>
  </mat-card-actions>
</mat-card>
