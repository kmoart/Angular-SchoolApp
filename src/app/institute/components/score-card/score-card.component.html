<mat-card>
  <mat-card-header>
    <mat-card-title>{{ score.nombre }}</mat-card-title>
    <mat-card-subtitle>{{ score.id }}</mat-card-subtitle>
  </mat-card-header>

  <!--TODO: imagen-->
  <img mat-card-image [src]=" score | scoreImage" [alt]="score.id">

  <mat-card-content class="mt-2">
    <h4>{{ score.nombre }}</h4>
    <p>
      <strong>Número de Id:</strong>{{ score.id }}
      <br>
    </p>
  </mat-card-content>
  <mat-divider></mat-divider>
  <mat-card-actions>
    <button mat-button
      mat-raised
      color="primary"
      [routerLink]="['/institute/editScore',score.id]">
    <mat-icon>edit</mat-icon>
    Editar
    </button>
    <span class="spacer"></span>
    <button mat-button
      mat-raised
      [routerLink]="['/institute/detailScore',score.id]">
      <mat-icon>more_horiz</mat-icon>
      Más...
    </button>
  </mat-card-actions>
</mat-card>
